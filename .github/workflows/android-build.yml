name: Android CI/CD

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            cat > app/google-services.json <<'EOF_JSON'
            {"project_info":{"project_number":"0","project_id":"traverse-ci","storage_bucket":"traverse-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:com.traverse.android","android_client_info":{"package_name":"com.traverse.android"}},"api_key":[{"current_key":"ci-placeholder"}],"services":{}}],"configuration_version":"1"}
          EOF_JSON
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug --stacktrace --no-daemon

  integration-tests:
    name: Android emulator integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            cat > app/google-services.json <<'EOF_JSON'
            {"project_info":{"project_number":"0","project_id":"traverse-ci","storage_bucket":"traverse-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:com.traverse.android","android_client_info":{"package_name":"com.traverse.android"}},"api_key":[{"current_key":"ci-placeholder"}],"services":{}}],"configuration_version":"1"}
          EOF_JSON
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - run: chmod +x gradlew
      - name: Run on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

  release:
    name: Signed Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Configure persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Set ANDROID_KEYSTORE_BASE64 in repository secrets."; exit 1; }
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || { echo "::error::Set ANDROID_RELEASE_STORE_PASSWORD in repository secrets."; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "::error::Set ANDROID_RELEASE_KEY_ALIAS in repository secrets."; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || { echo "::error::Set ANDROID_RELEASE_KEY_PASSWORD in repository secrets."; exit 1; }
          key_path="$RUNNER_TEMP/traverse-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Set up Google Services configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            cat > app/google-services.json <<'EOF_JSON'
            {"project_info":{"project_number":"0","project_id":"traverse-ci","storage_bucket":"traverse-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:com.traverse.android","android_client_info":{"package_name":"com.traverse.android"}},"api_key":[{"current_key":"ci-placeholder"}],"services":{}}],"configuration_version":"1"}
          EOF_JSON
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2>/dev/null; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: traverse-android-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Traverse Android ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
