name: Android CI/CD

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias traverse -keyalg RSA -keysize 2048 -validity 10000 -storepass traverse -keypass traverse -dname "CN=Traverse, OU=Mobile, O=Traverse, L=SF, S=CA, C=US"

    - name: Build Signed APK with Gradle
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: traverse-android-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        
    - name: Determine Release Tag
      id: release_tag
      if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
        else
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName = "([^"]+)".*/\1/' || echo "1.4")
          TAG_NAME="v${VERSION_NAME}-build.${{ github.run_number }}"
        fi
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

    - name: Create or Update GitHub Release
      if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_tag.outputs.tag_name }}
        name: "Traverse Android ${{ steps.release_tag.outputs.tag_name }}"
        files: |
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Send notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Build successful!"
        else
          echo "❌ Build failed!"
        fi


