# GitLab CI for traverse-android. GitHub Actions remains the primary CI workflow.
# Configure these protected variables before pushing a v* tag:
#   ANDROID_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD,
#   ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD.

stages:
  - test
  - build

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  DEBIAN_FRONTEND: noninteractive
  SDK_CACHE_KEY: "android-sdk-36"
  ANDROID_RELEASE_KEYSTORE_PATH: "$CI_PROJECT_DIR/release.keystore"

default:
  image: eclipse-temurin:17-jdk

.build-base:
  stage: build
  cache:
    key: "$SDK_CACHE_KEY"
    paths:
      - .android-sdk/
      - .gradle-home/
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip curl > /dev/null
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
        echo "Installing Android SDK (platform 36, build-tools 36.0.0)..."
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -sSL -o /tmp/cmdline-tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      else
        echo "Android SDK restored from cache."
      fi
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    - chmod +x gradlew

unit-tests:
  extends: .build-base
  stage: test
  script:
    - |
      if [ ! -f app/google-services.json ]; then
        cat > app/google-services.json <<'EOF_JSON'
        {"project_info":{"project_number":"0","project_id":"traverse-ci","storage_bucket":"traverse-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:com.traverse.android","android_client_info":{"package_name":"com.traverse.android"}},"api_key":[{"current_key":"ci-placeholder"}],"services":{}}],"configuration_version":"1"}
      EOF_JSON
      fi
    - ./gradlew testDebugUnitTest lintDebug --stacktrace --no-daemon

build-release:
  extends: .build-base
  needs: [unit-tests]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "ANDROID_KEYSTORE_BASE64 must be configured for release tags."; exit 1; }
      test -n "${ANDROID_RELEASE_STORE_PASSWORD:-}" || { echo "ANDROID_RELEASE_STORE_PASSWORD must be configured for release tags."; exit 1; }
      test -n "${ANDROID_RELEASE_KEY_ALIAS:-}" || { echo "ANDROID_RELEASE_KEY_ALIAS must be configured for release tags."; exit 1; }
      test -n "${ANDROID_RELEASE_KEY_PASSWORD:-}" || { echo "ANDROID_RELEASE_KEY_PASSWORD must be configured for release tags."; exit 1; }
      printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
    - |
      if [ -n "${GOOGLE_SERVICES_BASE64:-}" ]; then
        printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
      elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
        printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      fi
    - ./gradlew assembleRelease --stacktrace --no-daemon
  artifacts:
    name: "traverse-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 30 days

release:
  stage: build
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build-release"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      release-cli create \
        --name "Traverse Android ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --ref "$CI_COMMIT_SHA" \
        --description "Automated Android release from ${CI_COMMIT_SHORT_SHA}." \
        --assets-link "{\"name\":\"traverse-android.apk\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/app/build/outputs/apk/release/app-release.apk?job=build-release\"}"
